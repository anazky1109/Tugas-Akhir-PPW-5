<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kalkulator Interaktif — iOS Style</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ====== Basic reset ====== */
    * { box-sizing: border-box; }
    html,body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; background: linear-gradient(180deg,#f2f5f9,#eef3f8); color:#111; }

    /* ====== Centering container ====== */
    .page {
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    /* ====== Calculator shell ====== */
    .calc {
      width: 360px;
      max-width: calc(100vw - 40px);
      background: linear-gradient(180deg,#ffffff,#f7f9fc);
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(20,30,50,0.12), inset 0 1px 0 rgba(255,255,255,0.6);
      padding: 18px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      overflow: hidden;
    }

    /* ====== Top display area ====== */
    .display-wrap {
      display: flex;
      flex-direction: column;
      gap:8px;
    }

    .small-line {
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:12px;
      color:#6b7280;
      padding: 0 6px;
    }

    .screen {
      background: #0f1724;
      color: #f8fafc;
      border-radius: 14px;
      padding: 12px 14px;
      min-height: 64px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      text-align:right;
      box-shadow: inset 0 -6px 12px rgba(255,255,255,0.02);
    }

    .expr {
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      opacity: 0.9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .value {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 0.6px;
      margin-top:4px;
      word-break: break-all;
    }

    /* ====== Buttons grid ====== */
    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button.calc-btn {
      border: none;
      border-radius: 12px;
      padding: 14px 10px;
      font-size: 18px;
      background: linear-gradient(180deg,#f3f6fb,#edf2fa);
      box-shadow: 0 6px 12px rgba(17,24,39,0.06);
      cursor: pointer;
      transition: transform .08s ease, box-shadow .12s ease;
      user-select: none;
    }

    /* special style for operators */
    .operator { background: linear-gradient(180deg,#3b82f6,#2563eb); color: #fff; box-shadow: 0 8px 18px rgba(37,99,235,0.24); }
    .equal { background: linear-gradient(180deg,#fb923c,#fb7a2a); color:white; grid-column: span 2; box-shadow: 0 8px 18px rgba(251,122,42,0.22); }
    .wide { grid-column: span 2; }

    button.calc-btn:active { transform: translateY(2px) scale(.997); }
    button.calc-btn:focus { outline: none; box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }

    /* smaller operator look for top row */
    .muted { background: linear-gradient(180deg,#f8fafc,#eef2f7); color:#111; }

    /* ====== History & Memory areas ====== */
    .lower {
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 8px;
      width: 48%;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
      max-height:120px;
      overflow:auto;
    }

    .panel h5 { margin:4px 8px; font-size:13px; color:#374151; }
    .history-list { font-size:13px; color:#111; padding: 6px 8px; display:flex; flex-direction:column; gap:6px; }
    .history-item { background: #f8fafc; padding:8px; border-radius:8px; color:#0f1724; font-weight:500; box-shadow: 0 1px 2px rgba(12,15,20,0.03); }

    .memory-display { font-size:13px; color:#374151; padding:8px; border-radius:8px; background:#fbfbfe; }

    /* ====== Responsive tweaks ====== */
    @media (max-width:420px) {
      .calc { width: 96%; padding:12px; border-radius:18px; }
      .value { font-size:28px; }
      .controls { gap:8px; }
      button.calc-btn { padding:12px 8px; font-size:16px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="calc" role="application" aria-label="Kalkulator Anazky PPW 5">
      <div class="display-wrap">
        <div class="small-line">
          <span>Kalkulator Anazky PPW 5</span>
          <span id="mem-indicator" style="font-weight:600;color:#0b74ff;">M: 0</span>
        </div>

        <div id="screen" class="screen" tabindex="0">
          <div id="expression" class="expr">&nbsp;</div>
          <div id="value" class="value">0</div>
        </div>
      </div>

      <div class="controls" id="buttons">
        <!-- Row 1 -->
        <button class="calc-btn muted" data-action="C">C</button>
        <button class="calc-btn muted" data-action="CE">CE</button>
        <button class="calc-btn operator" data-op="/">÷</button>
        <button class="calc-btn operator" data-op="*">×</button>

        <!-- Row 2 -->
        <button class="calc-btn" data-num="7">7</button>
        <button class="calc-btn" data-num="8">8</button>
        <button class="calc-btn" data-num="9">9</button>
        <button class="calc-btn operator" data-op="-">−</button>

        <!-- Row 3 -->
        <button class="calc-btn" data-num="4">4</button>
        <button class="calc-btn" data-num="5">5</button>
        <button class="calc-btn" data-num="6">6</button>
        <button class="calc-btn operator" data-op="+">+</button>

        <!-- Row 4 -->
        <button class="calc-btn" data-num="1">1</button>
        <button class="calc-btn" data-num="2">2</button>
        <button class="calc-btn" data-num="3">3</button>
        <button class="calc-btn" data-action="." aria-label="decimal">.</button>

        <!-- Row 5 -->
        <button class="calc-btn wide" data-num="0">0</button>
        <button class="calc-btn equal" data-action="=">=</button>
      </div>

      <div class="lower" style="margin-top:6px;">
        <div class="panel">
          <h5>History (max 5)</h5>
          <div id="history" class="history-list" aria-live="polite"></div>
        </div>

        <div class="panel">
          <h5>Memory</h5>
          <div style="display:flex;gap:8px;margin-bottom:8px;">
            <button class="calc-btn muted" id="mc">MC</button>
            <button class="calc-btn muted" id="mr">MR</button>
            <button class="calc-btn muted" id="mplus">M+</button>
            <button class="calc-btn muted" id="mminus">M-</button>
          </div>
          <div id="memory" class="memory-display">Memory: 0</div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
